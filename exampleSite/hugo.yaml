baseURL: "https://archana-singh.com/"
languageCode: "en-us"
title: "Archana Singh"
theme: hugo-profile

defaultContentLanguage: "en"

# Demo blog posts, gallery and Spanish/French copies are not used on this site
ignoreFiles:
  - '(^|/)blogs(/|$)'
  - '(^|/)es(/|$)'
  - '(^|/)fr(/|$)'
  - 'gallery\.md$'

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  title: "Archana Singh"
  description: "Archana Singh - Full Stack Developer in Sydney (C#, .NET Core, Microservices, Kafka, React and TypeScript)"
  favicon: "/fav.png"
  useBootstrapCDN: false
  mathjax: false
  animate: true

  theme:

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  navbar:
    align: ms-auto
    showBrandLogo: false
    brandName: "Archana Singh"
    disableSearch: true
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: true
      disableContact: false

  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Archana."
    subtitle: "I'm a Full Stack Developer"
    content: "I build backend microservices and web features in C# and .NET Core, with Kafka, PostgreSQL, React and TypeScript, and I ship them through Kubernetes CI/CD pipelines. Based in Sydney, Australia."
    bottomImage:
      enable: false
    button:
      enable: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/archana-singh-a2664a26/
        - icon: fab fa-github
          url: https://github.com/Archana2201

  about:
    enable: true
    title: "About Me"
    content: |-
      I'm a Full Stack Developer at [FDJ UNITED](https://www.fdjunited.com) in Sydney, where I build and maintain backend microservices for a regulated betting platform used by 100,000+ customers across several countries. I designed the customer profile manager service and core rewards and wallet services, and I also deliver features in React and TypeScript.

      I care about performance, testing and reliable delivery: I cut deployment time to under 30 minutes with CI/CD pipelines, improved application performance by 50%, and keep test coverage above 90%. Before FDJ UNITED I worked as a Senior Consultant at Capgemini and as an IT Analyst at Tata Consultancy Services. I hold a Master of Applied Information Technology from Victoria University Sydney.
    skills:
      enable: true
      title: "Technologies I work with:"
      items:
        - "C#, .NET and ASP.NET Core"
        - "Entity Framework Core and REST APIs"
        - "Kafka, PostgreSQL and Couchbase"
        - "React and TypeScript"
        - "Docker, Kubernetes, Jenkins and Argo CD"
        - "Grafana, Loki and Tempo"
        - "NUnit, MSTest, Moq and SpecFlow"

  experience:
    enable: true
    items:
      - company: "FDJ UNITED"
        companyUrl: "https://www.fdjunited.com"
        jobs:
          - name: "Full Stack Developer"
            date: "Aug 2022 - Present"
            content: |
              Sydney, NSW. Backend microservices and web features for a regulated betting platform used by 100,000+ customers across several countries.

              - Designed and built the customer profile manager service and core rewards and wallet services, using C#, ASP.NET Core, Kafka and PostgreSQL
              - Improved application performance by 50% by optimising SQL queries and Entity Framework Core data access, validated through load and performance testing
              - Cut deployment time to under 30 minutes with CI/CD pipelines using Jenkins, Docker, Kubernetes and Argo CD
              - Kept test coverage above 90% with NUnit, MSTest, Moq and SpecFlow, and tracked code quality in SonarQube
              - Built Grafana dashboards and alerts on Loki logs and Tempo traces to catch production issues before customers noticed
              - Developed features for Cadmus Collector and Cadmus Inspector, the platform's regulatory auditing system
              - Shipped UI features in React and TypeScript, delivering work end to end across front end and back end
              - Mentored and onboarded new developers, getting them productive within 3 weeks

      - company: "Capgemini"
        companyUrl: "https://www.capgemini.com"
        jobs:
          - name: "Senior Consultant"
            date: "Oct 2020 - Oct 2021"
            content: |
              Mumbai, India. Senior consultant on client software projects, working with onsite clients from requirements through to delivery.

              - Coordinated the development team's daily work and delivery planning, keeping software releases on schedule
              - Gathered requirements directly with onsite clients and translated them into technical solutions
              - Resolved production issues and defects, working closely with clients to prioritise fixes
              - Raised code quality and consistency by leading peer code reviews and documentation reviews

      - company: "Tata Consultancy Services"
        companyUrl: "https://www.tcs.com"
        jobs:
          - name: "Information Technology Analyst"
            date: "Jan 2016 - Feb 2018"
            content: |
              Mumbai, India. Developed and maintained web applications using ASP.NET MVC, C#, SQL Server, REST APIs, jQuery, JavaScript, HTML and CSS.

              - Translated business requirements into technical designs with cross-functional teams, delivering projects on time and within budget
              - Improved application stability and performance by troubleshooting and resolving production defects
              - Worked in an Agile Scrum team, taking part in sprint planning, stand-ups, reviews and retrospectives
              - Trained and onboarded new team members, promoting knowledge sharing across the team

  education:
    enable: true
    index: false
    items:
      - title: "Master of Applied Information Technology"
        school:
          name: "Victoria University Sydney"
          url: "https://www.vu.edu.au"
        date: "Completed Jun 2022"

  achievements:
    enable: false

  projects:
    enable: true
    title: "Projects"
    items:
      - title: "ASX Stock Insights"
        image: /images/projects/asx-stock-insights.png
        content: "Screens and ranks ASX-style stocks from price history (50/200-day averages, momentum, RSI, volatility), P/E ratio and fundamentals. .NET 8 Clean Architecture API with a React dashboard. Uses synthetic sample data and is not financial advice."
        badges:
          - ".NET 8"
          - "EF Core"
          - "React"
          - "TypeScript"
          - "Strategy pattern"
        links:
          - icon: fab fa-github
            url: https://github.com/Archana2201/asx-stock-insights
        featured:
          name: "View on GitHub"
          link: https://github.com/Archana2201/asx-stock-insights

      - title: "Courier Platform"
        image: /images/projects/courier-platform.png
        content: "Starter platform for a courier start-up: price quotes, shipment booking, a lifecycle state machine and parcel tracking. .NET 8 microservices behind a YARP gateway, database per service, transactional outbox, plus a React web app."
        badges:
          - ".NET 8"
          - "Microservices"
          - "PostgreSQL"
          - "React"
          - "Docker"
        links:
          - icon: fab fa-github
            url: https://github.com/Archana2201/courier-platform
        featured:
          name: "View on GitHub"
          link: https://github.com/Archana2201/courier-platform

      - title: "Courier MCP Server"
        image: /images/projects/courier-mcp-server.png
        content: "Model Context Protocol server that lets AI assistants such as Claude quote, book and track parcels through the Courier Platform API. Typed tools with input validation, error handling and tests using a real MCP client."
        badges:
          - "MCP"
          - "TypeScript"
          - "Node.js"
          - "AI tooling"
        links:
          - icon: fab fa-github
            url: https://github.com/Archana2201/courier-platform/tree/main/mcp-server
        featured:
          name: "View on GitHub"
          link: https://github.com/Archana2201/courier-platform/tree/main/mcp-server

  contact:
    enable: true
    content: "I'm open to new opportunities. Whether you have a question or just want to say hi, send me a message on LinkedIn and I'll get back to you."
    btnName: "Message me on LinkedIn"
    btnLink: https://www.linkedin.com/in/archana-singh-a2664a26/

  footer:
    recentPosts:
      enable: false
    socialNetworks:
      github: https://github.com/Archana2201
      linkedin: https://www.linkedin.com/in/archana-singh-a2664a26/

  listPages:
    disableFeaturedImage: false

  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"
